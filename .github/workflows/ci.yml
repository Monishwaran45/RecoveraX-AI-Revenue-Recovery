name: RecoverAX Continuous Integration (CI)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend-ci:
    name: Backend Pytest, Lint & Coverage
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Lint Backend Code (Ruff)
        run: |
          ruff check app tests || echo "Ruff completed with non-blocking lint warnings."

      - name: Execute Pytest Suite with Coverage
        env:
          DEMO_MODE: "true"
          ENVIRONMENT: "testing"
          GROQ_MODEL: "qwen/qwen3.8-27b"
          CORS_ORIGINS: '["*"]'
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term-missing tests/

      - name: Upload Python Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend-ci:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Strict Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_BACKEND_URL: "https://recoverax-backend.onrender.com"
        run: npm run build

  docker-ci:
    name: Backend Docker Image Verification
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Validation)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: recoverax-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit || true
          pip-audit -r backend/requirements.txt || echo "Dependency audit finished with advisory warnings."
