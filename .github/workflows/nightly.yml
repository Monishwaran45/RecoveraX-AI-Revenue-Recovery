name: Nightly Test Suite & Quality Verification

on:
  schedule:
    # Runs comprehensive verification every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-nightly:
    name: Backend Pytest & Safety Verification
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Execute Full Pytest Suite
        env:
          PYTHONPATH: "."
          DEMO_MODE: "true"
          ENVIRONMENT: "testing"
          GROQ_MODEL: "qwen/qwen3.8-27b"
          CORS_ORIGINS: '["*"]'
        run: |
          pytest -v --cov=app tests/

  frontend-nightly:
    name: Frontend Next.js Build & Verification
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Production Application
        run: npm run build
